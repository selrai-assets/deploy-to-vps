# automation.yaml for the inbox-clearer demo.
# Field-by-field explanation: skills/deploy-to-vps/references/manifest.md

# Short handle. Names the folder on the box, the schedule and the logs.
name: inbox-clearer

# One sentence anyone would understand. Shown wherever this is listed.
description: Files notification noise out of the inbox and emails a brief of what is left.

# The person it runs as: their Google sign-in, their name on it.
# Change this to your own address before deploying.
owner: you@example.com

source:
  # local = a folder on your own computer. Copy this example folder to the
  # location below (or point location at wherever you keep it).
  type: local
  location: ~/automations/inbox-clearer

runtime:
  # A plain Python program. No Claude Code on the box, so no setup token.
  kind: script
  command: ./run.sh
  # packages lists apt software only. The gws command line tool is not an apt
  # package, so it has to be present on whatever machine runs this.
  packages: []

schedule:
  # Check any expression first:
  #   systemd-analyze calendar "Mon..Fri *-*-* 07:00:00" --iterations=3
  calendar: "Mon..Fri *-*-* 07:00:00"
  plain: Every weekday at 7am (box time).

# The Google sign-in the run needs. Declare-and-sync: this only names it, and
# deploy copies it onto the box over SSH. No secret ever goes in this file.
#
# gws keeps its sign-in behind the OS keystore, which does not copy as a file, so
# it gets exported to a scratch file first. Run this once before deploying:
#   mkdir -p ~/.cache/deploy-to-vps
#   umask 077 && gws auth export --unmasked > ~/.cache/deploy-to-vps/gws-credentials.json
# Delete the scratch file once deploy confirms the sync:
#   rm -f ~/.cache/deploy-to-vps/gws-credentials.json
# Both files below are required: without client_secret.json the box gets a
# misleading 403 about project permissions.
credentials:
  - from: ~/.cache/deploy-to-vps/gws-credentials.json
    to: .credentials/gws/credentials.json
  - from: ~/.config/gws/client_secret.json
    to: .credentials/gws/client_secret.json
# run.sh points gws at that folder and switches it to the file keyring backend,
# so no .credentials/env entry is needed for this one.

claude:
  # This automation does not run Claude Code, so no token is minted.
  setup_token: false
